
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Teste A-Frame Android</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

</head>

<body>

<a-scene
  renderer="antialias: false; precision: mediump">

  <a-assets>
    <img id="foto" src="./imagens/trex.jpg">
  </a-assets>

  <a-light type="ambient" intensity="2"></a-light>

  <a-plane
    position="0 2 -4"
    width="4"
    height="3"
    material="shader: flat; src: #foto">
  </a-plane>

  <a-camera position="0 1.7 0"></a-camera>

</a-scene>

</body>
</html>
