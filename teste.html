
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste de Fotografia</title>

<style>
body {
  margin: 0;
  background: #263b30;
  color: white;
  font-family: Arial;
  text-align: center;
}

#foto {
  width: 90%;
  max-width: 600px;
  margin-top: 30px;
  border: 5px solid #c7e99a;
  border-radius: 10px;
}
</style>
</head>

<body>

<h2>Museu dos Dinossauros</h2>

<p>Teste de exibição da fotografia</p>

<img
  id="foto"
  src="./imagens/trex.jpg"
  alt="Tiranossauro Rex">

<p id="status">Carregando...</p>

<script>

const foto = document.getElementById("foto");
const status = document.getElementById("status");

foto.onload = function() {
  status.innerHTML = "Fotografia carregada com sucesso!";
};

foto.onerror = function() {
  status.innerHTML = "Erro ao carregar fotografia.";
};

</script>

</body>
</html>
