
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Teste do Museu Virtual</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>

<body>

<a-scene
  background="color: #263b30"
  vr-mode-ui="enabled: false">

  <a-light type="ambient" intensity="2"></a-light>

  <!-- Piso -->
  <a-plane
    rotation="-90 0 0"
    width="12"
    height="20"
    color="#777064">
  </a-plane>

  <!-- Parede -->
  <a-box
    position="0 2.5 -6"
    width="12"
    height="5"
    depth=".2"
    color="#435847">
  </a-box>

  <!-- Fotografia -->
  <a-image
    src="./imagens/triceratops.jpg"
    position="0 2.5 -5.8"
    width="4"
    height="3">
  </a-image>

  <!-- Câmera -->
  <a-camera
    position="0 1.7 0"
    look-controls
    wasd-controls>
  </a-camera>

</a-scene>

</body>
</html>
