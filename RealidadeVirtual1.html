
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Experiência Virtual - Mundo dos Dinossauros</title>

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #mensagem {
      position: fixed;
      top: 12px;
      left: 10px;
      right: 10px;
      z-index: 9999;
      padding: 12px;
      background: rgba(0,0,0,0.8);
      color: white;
      text-align: center;
      border-radius: 8px;
      font-size: 14px;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="mensagem">
    Bem-vindo ao Mundo dos Dinossauros!
    Mova seu celular para explorar.
  </div>

  <a-scene
    vr-mode-ui="enabled: true"
    renderer="antialias: true; colorManagement: true"
  >

    <!-- CÉU -->

    <a-sky color="#72B8E8"></a-sky>

    <!-- TERRENO -->

    <a-plane
      position="0 0 0"
      rotation="-90 0 0"
      width="200"
      height="200"
      color="#397D32"
    >
    </a-plane>

    <!-- SOL -->

    <a-sphere
      position="-12 15 -25"
      radius="4"
      material="shader: flat; color: #FFD54F"
    >
    </a-sphere>

    <!-- MONTANHAS -->

    <a-cone
      position="-12 5 -30"
      radius-bottom="9"
      radius-top="0"
      height="15"
      color="#536B52"
    >
    </a-cone>

    <a-cone
      position="12 6 -35"
      radius-bottom="12"
      radius-top="0"
      height="18"
      color="#657B58"
    >
    </a-cone>

    <!-- ÁRVORES -->

    <a-cylinder
      position="-5 2 -8"
      radius="0.4"
      height="4"
      color="#795548"
    >
    </a-cylinder>

    <a-sphere
      position="-5 4.5 -8"
      radius="2"
      color="#1B5E20"
    >
    </a-sphere>

    <a-cylinder
      position="7 2 -12"
      radius="0.4"
      height="4"
      color="#795548"
    >
    </a-cylinder>

    <a-sphere
      position="7 4.5 -12"
      radius="2"
      color="#2E7D32"
    >
    </a-sphere>

    <!-- DINOSSAURO ILUSTRATIVO -->

    <a-entity position="0 0 -8">

      <!-- CORPO -->

      <a-box
        position="0 1.8 0"
        width="2.8"
        height="1.3"
        depth="1"
        color="#558B2F"
      >
      </a-box>

      <!-- CABEÇA -->

      <a-box
        position="0 2.7 -1.1"
        width="1.1"
        height="0.9"
        depth="1"
        color="#689F38"
      >
      </a-box>

      <!-- FOCINHO -->

      <a-box
        position="0 2.45 -1.8"
        width="1"
        height="0.35"
        depth="0.7"
        color="#33691E"
      >
      </a-box>

      <!-- OLHOS -->

      <a-sphere
        position="-0.45 2.9 -1.55"
        radius="0.12"
        color="#FFFF00"
      >
      </a-sphere>

      <a-sphere
        position="0.45 2.9 -1.55"
        radius="0.12"
        color="#FFFF00"
      >
      </a-sphere>

      <!-- CAUDA -->

      <a-cone
        position="0 1.9 1.9"
        rotation="90 0 0"
        radius-bottom="0.55"
        radius-top="0"
        height="2.5"
        color="#558B2F"
      >
      </a-cone>

      <!-- PERNAS -->

      <a-box
        position="-0.8 0.6 -0.2"
        width="0.4"
        height="1.2"
        depth="0.5"
        color="#33691E"
      >
      </a-box>

      <a-box
        position="0.8 0.6 -0.2"
        width="0.4"
        height="1.2"
        depth="0.5"
        color="#33691E"
      >
      </a-box>

    </a-entity>

    <!-- ILUMINAÇÃO -->

    <a-light
      type="ambient"
      color="#FFFFFF"
      intensity="0.8"
    >
    </a-light>

    <a-light
      type="directional"
      position="-5 10 5"
      intensity="1"
    >
    </a-light>

    <!-- CÂMERA DO VISITANTE -->

    <a-entity
      position="0 1.7 3"
      camera
      look-controls
      wasd-controls
    >
    </a-entity>

  </a-scene>

</body>
</html>
