
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Museu Virtual dos Dinossauros</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  overflow: hidden;
  background: #17251d;
}

#cabecalho {
  position: fixed;
  top: 0;
  width: 100%;
  z-index: 5;
  text-align: center;
  color: white;
  background: rgba(10,20,14,.85);
  padding: 12px;
}

#cabecalho h1 {
  margin: 3px;
  font-size: 20px;
  color: #c7e99a;
}

#cabecalho p {
  margin: 4px;
  font-size: 12px;
}

#controles {
  position: fixed;
  bottom: 20px;
  left: 15px;
  z-index: 10;
  display: flex;
  gap: 10px;
}

#controles button {
  width: 65px;
  height: 55px;
  font-size: 24px;
  border: none;
  border-radius: 12px;
  color: white;
  background: #648b48;
  touch-action: none;
}

#dica {
  position: fixed;
  bottom: 90px;
  left: 15px;
  z-index: 10;
  color: white;
  font-size: 12px;
  background: #14251dcc;
  padding: 10px;
  border-radius: 8px;
}

#informacoes {
  display: none;
  position: fixed;
  z-index: 20;
  width: 88%;
  max-width: 450px;
  max-height: 80vh;
  overflow-y: auto;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  background: #20382a;
  color: white;
  padding: 20px;
  border-radius: 15px;
  text-align: center;
  box-shadow: 0 0 30px #000;
}

#informacoes img {
  width: 100%;
  max-height: 230px;
  object-fit: contain;
  border-radius: 10px;
}

#informacoes h2 {
  color: #c7e99a;
}

#informacoes button {
  background: #719a4d;
  color: white;
  border: none;
  padding: 12px 25px;
  border-radius: 8px;
}

</style>
</head>

<body>

<header id="cabecalho">
  <h1>🦖 MUSEU VIRTUAL DOS DINOSSAUROS</h1>
  <p>Bem-vindo a uma viagem pela era pré-histórica!</p>
</header>

<div id="dica">
  Arraste a tela para olhar ao redor.<br>
  Use os controles para caminhar.<br>
  Olhe para uma foto para selecioná-la.
</div>

<div id="controles">
  <button onclick="mover(1)">⬆️</button>
  <button onclick="mover(-1)">⬇️</button>
</div>

<div id="informacoes">
  <img id="fotoGrande" src="" alt="Exposição">
  <h2 id="titulo"></h2>
  <p id="descricao"></p>
  <button onclick="fechar()">Voltar ao museu</button>
</div>

<a-scene
  embedded
  background="color: #17251d"
  vr-mode-ui="enabled: true"
  renderer="antialias: true">

  <!-- Iluminação -->
  <a-light
    type="ambient"
    color="#ffffff"
    intensity="1.1">
  </a-light>

  <a-light
    type="point"
    position="0 5 -5"
    intensity="1.5"
    distance="20">
  </a-light>

  <!-- Piso -->
  <a-plane
    position="0 0 0"
    rotation="-90 0 0"
    width="12"
    height="35"
    color="#756653">
  </a-plane>

  <!-- Teto -->
  <a-plane
    position="0 6 -10"
    rotation="90 0 0"
    width="12"
    height="35"
    color="#29392e">
  </a-plane>

  <!-- Parede esquerda -->
  <a-box
    position="-6 3 -10"
    width=".3"
    height="6"
    depth="35"
    color="#354b3b">
  </a-box>

  <!-- Parede direita -->
  <a-box
    position="6 3 -10"
    width=".3"
    height="6"
    depth="35"
    color="#354b3b">
  </a-box>

  <!-- Parede do fundo -->
  <a-box
    position="0 3 -27.5"
    width="12"
    height="6"
    depth=".3"
    color="#354b3b">
  </a-box>

  <!-- Fotografias do lado esquerdo -->

  <a-plane
    position="-5.78 3 -3"
    rotation="0 90 0"
    width="3"
    height="2"
    src="imagens/trex.jpg"
    class="foto"
    data-nome="Tiranossauro Rex"
    data-descricao="Um dos maiores predadores terrestres. Viveu no período Cretáceo e possuía uma poderosa mandíbula.">
  </a-plane>

  <a-plane
    position="-5.78 3 -9"
    rotation="0 90 0"
    width="3"
    height="2"
    src="imagens/velociraptor.jpg"
    class="foto"
    data-nome="Velociraptor"
    data-descricao="Um pequeno dinossauro carnívoro, ágil e conhecido por suas garras curvas.">
  </a-plane>

  <a-plane
    position="-5.78 3 -15"
    rotation="0 90 0"
    width="3"
    height="2"
    src="imagens/triceratops.jpg"
    class="foto"
    data-nome="Triceratops"
    data-descricao="Dinossauro herbívoro que possuía três chifres e um grande escudo ósseo na cabeça.">
  </a-plane>

  <!-- Fotografias do lado direito -->

  <a-plane
    position="5.78 3 -3"
    rotation="0 -90 0"
    width="3"
    height="2"
    src="imagens/braquiossauro.jpg"
    class="foto"
    data-nome="Braquiossauro"
    data-descricao="Grande dinossauro herbívoro, conhecido por seu pescoço comprido.">
  </a-plane>

  <a-plane
    position="5.78 3 -9"
    rotation="0 -90 0"
    width="3"
    height="2"
    src="imagens/fossil.jpg"
    class="foto"
    data-nome="Fósseis"
    data-descricao="Os fósseis ajudam os pesquisadores a compreender a vida na Terra há milhões de anos.">
  </a-plane>

  <a-plane
    position="5.78 3 -15"
    rotation="0 -90 0"
    width="3"
    height="2"
    src="imagens/prehistoria.jpg"
    class="foto"
    data-nome="Era Pré-Histórica"
    data-descricao="Conheça os ambientes e ecossistemas que existiam durante a era dos dinossauros.">
  </a-plane>

  <!-- Câmera do visitante -->
  <a-entity
    id="camera"
    camera
    position="0 1.7 5"
    look-controls
    wasd-controls="acceleration: 20">

    <a-cursor
      fuse="true"
      fuse-timeout="1200"
      raycaster="objects: .foto"
      color="#c7e99a"
      scale=".5 .5 .5">
    </a-cursor>

  </a-entity>

</a-scene>

<script>

// Movimento pelo museu

function mover(direcao) {

  const camera = document.querySelector("#camera");

  const posicao = camera.object3D.position;

  const direcaoCamera = new THREE.Vector3();

  camera.object3D.getWorldDirection(direcaoCamera);

  posicao.addScaledVector(direcaoCamera, direcao * 1.5);

  // Limites do museu
  posicao.x = Math.max(-4.5, Math.min(4.5, posicao.x));
  posicao.z = Math.max(-25, Math.min(4, posicao.z));
  posicao.y = 1.7;

}

// Fotografias interativas

const fotos = document.querySelectorAll(".foto");

fotos.forEach(foto => {

  foto.addEventListener("click", function() {

    const imagem = this.getAttribute("src");

    document.getElementById("fotoGrande").src = imagem;

    document.getElementById("titulo").innerText =
      this.getAttribute("data-nome");

    document.getElementById("descricao").innerText =
      this.getAttribute("data-descricao");

    document.getElementById("informacoes").style.display =
      "block";

  });

});

function fechar() {

  document.getElementById("informacoes").style.display =
    "none";

}

</script>

</body>
</html>
