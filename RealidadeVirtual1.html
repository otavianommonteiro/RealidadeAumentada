
<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Museu Virtual dos Dinossauros</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

/* Cabeçalho */

#cabecalho {
  position: fixed;
  top: 0;
  width: 100%;
  padding: 10px;
  background: rgba(0,0,0,.85);
  color: white;
  text-align: center;
  z-index: 10;
}

#cabecalho h2 {
  color: #b8df8b;
  margin: 5px;
}

/* Painel */

#painel {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 88%;
  max-width: 500px;
  max-height: 85vh;
  overflow-y: auto;
  background: #20382a;
  color: white;
  padding: 18px;
  border-radius: 15px;
  text-align: center;
  z-index: 20;
  box-shadow: 0 0 25px black;
}

#painel h2 {
  color: #c7e99a;
}

#fotoPrincipal {
  width: 100%;
  max-height: 210px;
  object-fit: contain;
  border-radius: 10px;
}

#conteudo {
  text-align: left;
  line-height: 1.6;
}

#botoes {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 5px;
  margin: 15px 0;
}

button {
  background: #719b4c;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 11px 14px;
  cursor: pointer;
}

button:hover {
  background: #91b968;
}

.ativo {
  background: #c28b37;
}

#imagemExtra {
  display: none;
  width: 100%;
  max-height: 230px;
  object-fit: contain;
  border-radius: 10px;
  margin-top: 10px;
}

#instrucoes {
  position: fixed;
  bottom: 12px;
  left: 10px;
  z-index: 10;
  background: rgba(0,0,0,.8);
  color: white;
  padding: 10px;
  border-radius: 8px;
  font-size: 12px;
}

</style>
</head>

<body>

<!-- CABEÇALHO -->

<div id="cabecalho">

  <h2>🦖 Museu Virtual dos Dinossauros</h2>

  <p>Conheça os gigantes da pré-história</p>

</div>

<!-- INSTRUÇÕES -->

<div id="instrucoes">

  Clique na fotografia para conhecer o T-Rex.
  <br>
  Arraste a tela para olhar ao redor.

</div>

<!-- PAINEL INTERATIVO -->

<div id="painel">

  <img
    id="fotoPrincipal"
    src="./imagens/trex.jpg"
    alt="Tiranossauro Rex">

  <h2>🦖 Tiranossauro Rex</h2>

  <div id="botoes">

    <button onclick="mostrarAba('dados', this)">
      Dados científicos
    </button>

    <button onclick="mostrarAba('curiosidades', this)">
      Curiosidades
    </button>

    <button onclick="mostrarAba('tamanho', this)">
      Comparação
    </button>

    <button onclick="mostrarAba('habitat', this)">
      Habitat
    </button>

  </div>

  <div id="conteudo">

    O Tiranossauro Rex foi um dos maiores predadores
    terrestres que já existiram.

  </div>

  <img id="imagemExtra" src="" alt="Imagem complementar">

  <br><br>

  <button onclick="fecharPainel()">
    Voltar ao museu
  </button>

</div>

<!-- MUSEU 3D -->

<a-scene
  background="color: #263b30"
  vr-mode-ui="enabled: false"
  renderer="antialias: false; precision: mediump">

  <!-- CARREGAMENTO ANTECIPADO DAS IMAGENS -->

  <a-assets timeout="15000">

    <img
      id="imagemTrex"
      src="./imagens/trex.jpg">

  </a-assets>

  <!-- ILUMINAÇÃO -->

  <a-light
    type="ambient"
    intensity="1.5">
  </a-light>

  <a-light
    type="point"
    position="0 4 -4"
    intensity="2">
  </a-light>

  <!-- PISO -->

  <a-plane
    rotation="-90 0 0"
    width="12"
    height="20"
    color="#777064">
  </a-plane>

  <!-- PAREDE -->

  <a-box
    position="0 2.5 -6"
    width="12"
    height="5"
    depth=".2"
    color="#435847">
  </a-box>

  <!-- FOTOGRAFIA DO T-REX -->

  <a-plane
    id="fotoTrex"
    position="0 2.5 -5.75"
    width="4"
    height="3"
    material="
      src: #imagemTrex;
      shader: flat;
      side: double;
      transparent: false;
      opacity: 1
    "
    class="clicavel">
  </a-plane>

  <!-- CÂMERA -->

  <a-camera
    position="0 1.7 0"
    look-controls="magicWindowTrackingEnabled: false; touchEnabled: true; mouseEnabled: true"
    wasd-controls="enabled: false">

    <a-cursor
      color="#c7e99a"
      fuse="false"
      raycaster="objects: .clicavel">
    </a-cursor>

  </a-camera>

</a-scene>

<script>

// ABRIR A EXPOSIÇÃO

document.getElementById("fotoTrex")
.addEventListener("click", function() {

  document.getElementById("painel").style.display = "block";

  mostrarAba("dados");

});


// INFORMAÇÕES DAS ABAS

const conteudos = {

  dados: `
    <h3>📚 Dados científicos</h3>

    <p><strong>Nome científico:</strong> Tyrannosaurus rex</p>

    <p><strong>Período:</strong> Cretáceo Superior,
    aproximadamente 68 a 66 milhões de anos atrás.</p>

    <p><strong>Alimentação:</strong> Carnívora.</p>

    <p><strong>Comprimento:</strong> Aproximadamente
    12 a 13 metros.</p>

    <p><strong>Peso:</strong> Podia ultrapassar
    8 toneladas.</p>

    <p><strong>Localização:</strong> América do Norte.</p>
  `,

  curiosidades: `
    <h3>🔎 Você sabia?</h3>

    <p>1. O T-Rex possuía dentes grandes e serrilhados.</p>

    <p>2. Seus braços eram curtos, mas musculosos.</p>

    <p>3. Possuía uma mordida extremamente poderosa.</p>

    <p>4. Seu nome significa "rei dos lagartos tiranos".</p>
  `,

  tamanho: `
    <h3>📏 Comparação de tamanho</h3>

    <p>O T-Rex podia alcançar aproximadamente
    12 a 13 metros de comprimento.</p>

    <p>Isso equivale a vários seres humanos
    posicionados em fila!</p>

    <p>Observe a imagem para visualizar
    a diferença de tamanho.</p>
  `,

  habitat: `
    <h3>🌳 Onde vivia?</h3>

    <p>O T-Rex habitava regiões que hoje fazem
    parte da América do Norte.</p>

    <p>Vivia em ambientes que incluíam florestas,
    planícies e regiões próximas a rios.</p>

    <p>Esses ambientes eram muito diferentes
    dos atuais.</p>
  `

};


// MOSTRAR INFORMAÇÕES

function mostrarAba(aba, botao) {

  document.getElementById("conteudo").innerHTML =
    conteudos[aba];

  const imagem = document.getElementById("imagemExtra");

  imagem.style.display = "none";
  imagem.src = "";

  if (aba === "tamanho") {

    imagem.src = "./imagens/comparacao.jpg";
    imagem.style.display = "block";

  }

  if (aba === "habitat") {

    imagem.src = "./imagens/habitat.jpg";
    imagem.style.display = "block";

  }

  document.querySelectorAll("#botoes button")
  .forEach(b => b.classList.remove("ativo"));

  if (botao) {
    botao.classList.add("ativo");
  } else {
    document.querySelectorAll("#botoes button")[0]
    .classList.add("ativo");
  }

}


// FECHAR PAINEL

function fecharPainel() {

  document.getElementById("painel").style.display = "none";

}

</script>

</body>
</html>
