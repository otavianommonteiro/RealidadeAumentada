
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Realidade Aumentada - Cachorro NFT</title>

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #status {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      border-radius: 8px;
      font-size: 14px;
    }
  </style>

  <!-- AJUSTE DE CÂMERA PARA ANDROID -->

  <script>
    (function () {

      const isAndroid =
        /Android/i.test(navigator.userAgent);

      if (!isAndroid) return;

      const mediaDevices = navigator.mediaDevices;

      if (!mediaDevices ||
          !mediaDevices.getUserMedia) return;

      const originalGetUserMedia =
        mediaDevices.getUserMedia.bind(mediaDevices);

      mediaDevices.getUserMedia = function (constraints) {

        if (!constraints ||
            constraints.video === false) {
          return originalGetUserMedia(constraints);
        }

        const videoConstraints =
          constraints.video === true
            ? {}
            : { ...constraints.video };

        videoConstraints.facingMode = {
          ideal: "environment"
        };

        videoConstraints.width = {
          ideal: 640
        };

        videoConstraints.height = {
          ideal: 480
        };

        return originalGetUserMedia({
          ...constraints,
          video: videoConstraints
        });

      };

    })();
  </script>

  <!-- AR.JS ESPECÍFICO PARA NFT -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar-nft.js"></script>

</head>

<body>

  <div id="status">
    Inicializando reconhecimento NFT...
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"

    renderer="
      antialias: false;
      colorManagement: true;
      logarithmicDepthBuffer: true;
      precision: medium;
    "

    arjs="
      sourceType: webcam;
      trackingMethod: best;
      debugUIEnabled: false;
    "
  >

    <!-- MARCADOR NFT DO CACHORRO -->

    <a-nft
      type="nft"
      url="./Portrait_of_a_dog_by_Damien_Linnane"
      id="marcador"
      emitevents="true"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >

      <!-- OBJETO VIRTUAL -->

      <a-box
        position="0 0.5 0"
        width="1"
        height="1"
        depth="1"
        color="#1a73e8"
        material="roughness: 0.6"
      >
      </a-box>

    </a-nft>

    <!-- CÂMERA -->

    <a-entity camera></a-entity>

  </a-scene>

  <!-- CONTROLE DE RECONHECIMENTO -->

  <script>

    const marcador =
      document.getElementById("marcador");

    const cena =
      document.querySelector("a-scene");

    const status =
      document.getElementById("status");

    // Arquivos NFT carregados

    cena.addEventListener(
      "arjs-nft-loaded",
      function () {

        status.textContent =
          "NFT carregado! Aponte para a imagem do cachorro.";

        status.style.background =
          "rgba(0, 80, 150, 0.85)";

        console.log("Arquivos NFT carregados!");

      }
    );

    // Imagem reconhecida

    marcador.addEventListener(
      "markerFound",
      function () {

        status.textContent =
          "CACHORRO RECONHECIDO!";

        status.style.background =
          "rgba(0, 120, 40, 0.85)";

        console.log("NFT reconhecido!");

      }
    );

    // Imagem deixou de ser reconhecida

    marcador.addEventListener(
      "markerLost",
      function () {

        status.textContent =
          "Procurando imagem do cachorro...";

        status.style.background =
          "rgba(0, 0, 0, 0.75)";

        console.log("NFT perdido!");

      }
    );

    // Controle de erros da câmera

    cena.addEventListener(
      "camera-error",
      function (event) {

        status.textContent =
          "Erro ao acessar a câmera.";

        console.error("Erro de câmera:", event);

      }
    );

  </script>

</body>
</html>
