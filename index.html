
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caça ao Tesouro AR</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; }
    #painel {
      position: fixed; z-index: 10; top: 10px; left: 10px;
      padding: 12px; background: white; border-radius: 10px;
    }
    button { padding: 10px; }
  </style>
</head>
<body>
  <div id="painel">
    <strong>Caça ao Tesouro</strong>
    <p id="mensagem">Aponte para o marcador Hiro.</p>
    <button onclick="coletar()">Coletar tesouro</button>
    <p id="pontos">Pontos: 0</p>
  </div>

  <a-scene embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker preset="hiro" id="marcador">
      <a-box position="0 0.5 0"
        color="gold" depth="0.5" height="0.5" width="0.5">
        <a-animation
          attribute="rotation"
          to="0 360 0"
          dur="3000"
          repeat="indefinite">
        </a-animation>
      </a-box>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    let pontos = 0;
    let coletado = false;

    function coletar() {
      const marcador = document.getElementById("marcador");

      if (!marcador.object3D.visible) {
        document.getElementById("mensagem").textContent =
          "Encontre o marcador primeiro!";
        return;
      }

      if (!coletado) {
        pontos += 10;
        coletado = true;
        document.getElementById("pontos").textContent =
          "Pontos: " + pontos;
        document.getElementById("mensagem").textContent =
          "Tesouro coletado!";
      }
    }
  </script>
</body>
</html>
