
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Realidade Aumentada - NFT T-Rex</title>

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #status {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.80);
      color: white;
      border-radius: 8px;
      font-size: 14px;
    }
  </style>

  <!-- AJUSTE DE CÂMERA PARA ANDROID -->

  <script>
    (function () {

      const isAndroid =
        /Android/i.test(navigator.userAgent);

      if (!isAndroid) return;

      const mediaDevices = navigator.mediaDevices;

      if (!mediaDevices ||
          !mediaDevices.getUserMedia) return;

      const originalGetUserMedia =
        mediaDevices.getUserMedia.bind(mediaDevices);

      mediaDevices.getUserMedia = function (constraints) {

        if (!constraints ||
            constraints.video === false) {
          return originalGetUserMedia(constraints);
        }

        const videoConstraints =
          constraints.video === true
            ? {}
            : { ...constraints.video };

        // Câmera traseira
        videoConstraints.facingMode = {
          ideal: "environment"
        };

        // Resolução
        videoConstraints.width = {
          ideal: 640
        };

        videoConstraints.height = {
          ideal: 480
        };

        return originalGetUserMedia({
          ...constraints,
          video: videoConstraints
        });

      };

    })();
  </script>

  <!-- AR.JS PARA NFT -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar-nft.js"></script>

</head>

<body>

  <div id="status">
    Inicializando reconhecimento NFT...
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"

    renderer="
      antialias: false;
      colorManagement: true;
      logarithmicDepthBuffer: true;
      precision: medium;
    "

    arjs="
      sourceType: webcam;
      trackingMethod: best;
      debugUIEnabled: false;
    "
  >

    <!-- MARCADOR NFT T-REX -->

    <a-nft
      type="nft"
      url="./trex"
      id="marcador"
      emitevents="true"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >

      <!-- OBJETO VIRTUAL -->

      <a-box
        position="0 0.5 0"
        width="1"
        height="1"
        depth="1"
        color="#1a73e8"
        material="roughness: 0.6"
      >
      </a-box>

    </a-nft>

    <!-- CÂMERA -->

    <a-entity camera></a-entity>

  </a-scene>

  <!-- CONTROLE DO RECONHECIMENTO -->

  <script>

    const marcador =
      document.getElementById("marcador");

    const status =
      document.getElementById("status");

    function atualizarStatus(mensagem, cor) {

      status.textContent = mensagem;
      status.style.background = cor;

    }

    // Inicialização da câmera

    window.addEventListener("camera-init", function () {

      console.log("Câmera inicializada.");

      atualizarStatus(
        "Câmera iniciada. Carregando NFT...",
        "rgba(0, 80, 150, 0.85)"
      );

    });

    // Arquivos NFT carregados

    window.addEventListener("arjs-nft-loaded", function (event) {

      console.log("NFT carregado:", event.detail);

      atualizarStatus(
        "NFT carregado! Aponte para o T-Rex.",
        "rgba(0, 100, 150, 0.85)"
      );

    });

    // Marcador reconhecido

    marcador.addEventListener("markerFound", function () {

      console.log("T-Rex reconhecido!");

      atualizarStatus(
        "T-REX RECONHECIDO!",
        "rgba(0, 120, 40, 0.85)"
      );

    });

    // Marcador perdido

    marcador.addEventListener("markerLost", function () {

      console.log("Marcador perdido.");

      atualizarStatus(
        "Procurando marcador T-Rex...",
        "rgba(0, 0, 0, 0.80)"
      );

    });

    // Erros de câmera

    window.addEventListener("camera-error", function (event) {

      console.error("Erro de câmera:", event);

      atualizarStatus(
        "Erro ao acessar a câmera.",
        "rgba(180, 0, 0, 0.85)"
      );

    });

    // Erros JavaScript

    window.addEventListener("error", function (event) {

      console.error("Erro JavaScript:", event.message);

    });

    window.addEventListener("unhandledrejection", function (event) {

      console.error("Erro de carregamento:", event.reason);

    });

  </script>

</body>
</html>
