
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Realidade Aumentada - NFT T-Rex</title>

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.JS NFT -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar-nft.js"></script>

  <style>

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: transparent;
    }

    /* MENSAGEM DE STATUS */

    #status {
      position: fixed;

      top: calc(env(safe-area-inset-top, 0px) + 12px);
      left: 12px;
      right: 12px;

      width: auto;
      min-height: 40px;
      box-sizing: border-box;

      padding: 12px 14px;

      background: rgba(0, 0, 0, 0.90);
      color: #ffffff;

      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 10px;

      font-family: Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      font-weight: bold;

      text-align: center;

      white-space: normal;
      overflow-wrap: anywhere;

      display: block;
      visibility: visible;
      opacity: 1;

      z-index: 999999;
      pointer-events: none;
    }

  </style>

</head>

<body>

  <!-- MENSAGEM NA TELA -->

  <div id="status">
    Inicializando reconhecimento NFT...
  </div>

  <script>

    const status = document.getElementById("status");

    let cameraIniciada = false;
    let nftCarregado = false;
    let marcadorEncontrado = false;
    let timeoutNFT = null;

    // ATUALIZAÇÃO DA MENSAGEM

    function atualizarStatus(mensagem, cor) {

      status.textContent = mensagem;
      status.style.background = cor;

      console.log("[AR]", mensagem);

    }

    // CÂMERA INICIADA

    window.addEventListener("camera-init", function () {

      cameraIniciada = true;

      atualizarStatus(
        "Câmera iniciada. Carregando arquivos NFT...",
        "rgba(0, 80, 150, 0.90)"
      );

      // TEMPO MÁXIMO PARA CARREGAMENTO NFT

      timeoutNFT = setTimeout(function () {

        if (!nftCarregado) {

          atualizarStatus(
            "ERRO: NFT não carregado. Verifique os arquivos trex.fset, trex.fset3 e trex.iset.",
            "rgba(180, 0, 0, 0.90)"
          );

          console.error(
            "Tempo esgotado aguardando arjs-nft-loaded."
          );

        }

      }, 45000);

    });

    // CÂMERA PRONTA

    window.addEventListener("arjs-video-loaded", function () {

      console.log("Vídeo da câmera carregado.");

    });

    // NFT CARREGADO

    window.addEventListener("arjs-nft-loaded", function (event) {

      nftCarregado = true;

      clearTimeout(timeoutNFT);

      console.log("NFT carregado com sucesso:", event.detail);

      atualizarStatus(
        "NFT carregado! Aponte a câmera para o T-Rex.",
        "rgba(0, 110, 150, 0.90)"
      );

    });

    // ERRO DE CÂMERA

    window.addEventListener("camera-error", function (event) {

      console.error("Erro de câmera:", event);

      atualizarStatus(
        "Erro ao acessar a câmera. Verifique as permissões.",
        "rgba(180, 0, 0, 0.90)"
      );

    });

    // AGUARDA A CRIAÇÃO DA CENA

    document.addEventListener("DOMContentLoaded", function () {

      const scene = document.querySelector("a-scene");

      function configurarMarcador() {

        const marcador = document.getElementById("marcador");

        if (!marcador) {

          console.error("Marcador NFT não encontrado.");

          return;

        }

        console.log("Marcador NFT configurado.");

        // MARCADOR ENCONTRADO

        marcador.addEventListener("markerFound", function () {

          marcadorEncontrado = true;

          atualizarStatus(
            "T-REX RECONHECIDO!",
            "rgba(0, 130, 40, 0.95)"
          );

        });

        // MARCADOR PERDIDO

        marcador.addEventListener("markerLost", function () {

          marcadorEncontrado = false;

          atualizarStatus(
            nftCarregado
              ? "NFT carregado. Procurando marcador T-Rex..."
              : "Aguardando carregamento NFT...",
            "rgba(0, 0, 0, 0.85)"
          );

        });

      }

      if (scene.hasLoaded) {

        configurarMarcador();

      } else {

        scene.addEventListener("loaded", configurarMarcador, {
          once: true
        });

      }

      scene.addEventListener("loaded", function () {

        console.log("Cena A-Frame carregada.");

      });

    });

    // ERROS JAVASCRIPT

    window.addEventListener("error", function (event) {

      console.error("Erro JavaScript:", event.message);

    });

    // ERROS DE PROMISE

    window.addEventListener("unhandledrejection", function (event) {

      console.error("Erro de carregamento:", event.reason);

      atualizarStatus(
        "Erro durante o carregamento. Consulte o Console.",
        "rgba(180, 0, 0, 0.90)"
      );

    });

  </script>

  <!-- CENA AR -->

  <a-scene
    embedded

    vr-mode-ui="enabled: false"

    renderer="
      antialias: false;
      colorManagement: true;
      logarithmicDepthBuffer: true;
      precision: medium;
    "

    arjs="
      sourceType: webcam;
      trackingMethod: best;
      debugUIEnabled: false;
    "
  >

    <!-- MARCADOR NFT -->

    <a-nft
      type="nft"
      url="/RealidadeAumentada/trex/trex"
      id="marcador"
      emitevents="true"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >

      <!-- OBJETO VIRTUAL -->

      <a-box
        position="0 0.5 0"
        width="1"
        height="1"
        depth="1"
        color="#1a73e8"
        material="roughness: 0.6"
      >
      </a-box>

    </a-nft>

    <!-- CÂMERA -->

    <a-entity camera></a-entity>

  </a-scene>

</body>

</html>
